server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A API atras do mesmo host, em /api. Isso resolve o CORS de vez: para o
    # navegador passa a ser tudo a mesma origem, e some a lista de origens
    # permitidas que hoje o FastAPI precisa manter.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }

    # Rotas do React nao existem no disco: /times/147 e resolvido no navegador.
    # Sem este fallback, recarregar a pagina nessa URL daria 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
