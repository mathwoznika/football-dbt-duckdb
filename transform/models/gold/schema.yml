version: 2

models:

  - name: gold_classificacao
    description: >
      Classificacao calculada a partir dos resultados, so para competicoes de
      pontos corridos e apenas na fase regular. Os pontos batem 100% com o
      standings oficial da API — ver o teste singular que garante isso.
    columns:
      - name: time_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_time')
              field: team_id
      - name: posicao
        tests: [not_null]
      - name: pontos
        tests: [not_null]
      - name: ultimos_5
        description: >
          Resultados dos 5 ultimos jogos em ORDEM CRONOLOGICA — o primeiro
          caractere e o mais antigo e o ultimo e o jogo mais recente. A ordem e
          essa de proposito: assim quem desenha percorre da esquerda para a
          direita e o jogo mais recente cai na direita.

  - name: gold_time_temporada
    description: >
      Cabecalho da pagina de um time: uma linha por competicao disputada na
      temporada, copa inclusive.

      Cuidado com duas colunas. `maior_invencibilidade` e a MAIOR sequencia
      invicta da temporada, um recorde, nao o estado atual — para o atual use
      jogos_sem_derrota / jogos_sem_vitoria. E `posicao` e a colocacao na
      tabela de pontos corridos, que num torneio com mata-mata descreve a fase
      de grupos e nao a campanha; para isso use `resultado_final`.
    columns:
      - name: time_id
        tests: [not_null]
      - name: jogos
        tests: [not_null]
      - name: ultimo_resultado
        tests:
          - accepted_values:
              values: ['V', 'E', 'D']

  - name: gold_partida
    description: >
      Cabecalho de um jogo. E o UNICO mart no grao de partida — todos os outros
      olham do ponto de vista de um time. A pagina de um jogo precisa dos dois
      lados ao mesmo tempo.
    columns:
      - name: fixture_id
        tests: [unique, not_null]
      - name: time_casa_id
        tests: [not_null]
      - name: time_fora_id
        tests: [not_null]

  - name: gold_escalacao
    description: >
      Escalacao pronta para desenhar num campo. As coordenadas `linha` e
      `coluna` vem do campo `grid` da API (formato "linha:coluna", 1:1 e o
      goleiro), entao nenhuma formacao precisa ser codificada — o 4-2-3-1 e o
      3-5-2 se desenham sozinhos.

      `jogadores_na_linha` sai daqui e nao do front porque centralizar uma
      linha de 4 zagueiros contra uma de 1 atacante e pergunta sobre o dado.
      Reserva nao tem posicao: a API so posiciona quem comecou jogando.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]

  - name: gold_partida_estatistica
    description: >
      Estatistica coletiva de um jogo, um lado por linha e os dois simetricos.
      Diferente do silver_partida_estatistica, que traz "pro/contra" na
      perspectiva de um time — a pagina de jogo compara os dois de igual para
      igual e inverter um deles atrapalharia.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]

  - name: gold_partida_evento
    description: >
      Linha do tempo de uma partida, com os papeis dos jogadores resolvidos.

      O trabalho deste model e desambiguar os dois campos de jogador que a API
      manda, porque o significado MUDA com o tipo do evento. Em substituicao a
      convencao e o inverso do que os nomes sugerem: "player" e quem SAI e
      "assist" e quem ENTRA — verificado nas 580 substituicoes da base.
      A coluna `papel_relacionado` entrega isso resolvido.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: minuto
        tests: [not_null]
      - name: rotulo
        description: Nome do lance em portugues, pronto para a tela.
        tests: [not_null]

  - name: gold_jogador_partida
    description: >
      Atuacao de um jogador em cada partida com o contexto do jogo ao lado,
      para a pagina do jogador mostrar "7.8 contra o Palmeiras, vitoria por
      2x1" numa linha so.

      ATENCAO a cobertura: a onda 3 so cobre jogos do Coritiba, e o endpoint
      devolve os DOIS times. Jogador de adversario aparece com 1 ou 2 jogos —
      ver a nota sobre isso em docs/contexto.md antes de agregar como carreira.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]

  - name: gold_artilheiro
    description: >
      Artilharia oficial de cada competicao e temporada, uma linha por jogador.

      Consolida uma duplicidade da fonte: jogador que trocou de clube vem com
      duas entradas e a API REPETE o mesmo bloco de numeros sob os dois times.
      Por isso as metricas usam max e nao sum — somar daria 34 gols a quem fez
      17. A coluna teve_mais_de_um_clube marca os casos afetados.

      Vem do endpoint /players/topscorers e nao dos eventos, porque a onda 3 so
      cobre jogos do Coritiba e nao veria gol de Palmeiras x Flamengo.
    columns:
      - name: player_id
        tests: [not_null]
      - name: gols
        tests: [not_null]
      - name: posicao_artilharia
        tests: [not_null]

  - name: gold_desempenho_por_tempo
    description: >
      Primeiro contra segundo tempo, e o que o time faz com a vantagem.

      Nao depende da onda 3: o placar do intervalo vem no proprio fixture,
      entao cobre os 1.746 jogos da base e nao apenas os detalhados.

      A coluna pontos_se_acabasse_no_1t responde uma pergunta que a tabela nao
      responde — o time ganha ou perde campeonato no segundo tempo. O Coritiba
      na Serie A 2023 fez 30 pontos e teria feito 42; foi o que mais perdeu
      pontos em segundos tempos naquele campeonato.
    columns:
      - name: time_id
        tests: [not_null]
      - name: jogos
        tests: [not_null]
      - name: pontos_se_acabasse_no_1t
        tests: [not_null]

  - name: gold_gols_por_periodo
    description: >
      Distribuicao dos gols marcados e sofridos por faixa de 15 minutos.

      COBERTURA PARCIAL: vem dos eventos, que so existem para os jogos ja
      alcancados pela onda 3. A coluna jogos_com_evento diz sobre quantas
      partidas a distribuicao foi calculada — sem ela, comparar temporadas com
      coberturas diferentes leva a conclusao errada.
    columns:
      - name: time_id
        tests: [not_null]
      - name: ordem_faixa
        tests: [not_null]

  - name: gold_confronto_eliminatorio
    description: >
      Chaveamento do mata-mata. Grao: um CONFRONTO, nao uma partida — os dois
      jogos de ida e volta viram uma linha, com o placar agregado.

      O vencedor sai do agregado de gols e, se empatado, dos penaltis. Quando
      nem isso resolve, e inferido por presenca numa fase posterior, o que cobre
      qualquer regra de desempate sem precisar modela-la.
    columns:
      - name: league_id
        tests: [not_null]
      - name: season
        tests: [not_null]
      - name: ordem_fase
        description: 1=primeira fase ... 7=final. Serve para ordenar o chaveamento.
        tests: [not_null]
      - name: time_a_id
        tests: [not_null]
      - name: time_b_id
        tests: [not_null]

  - name: gold_evolucao_classificacao
    description: >
      Pontos e posicao de cada time apos cada rodada. Alimenta o grafico de
      linha da temporada.
    columns:
      - name: time_id
        tests: [not_null]
      - name: rodada_n
        tests: [not_null]
      - name: posicao
        tests: [not_null]

  - name: gold_confronto_direto
    description: >
      Retrospecto entre dois times. Cada confronto aparece nos dois sentidos,
      para a API consultar sempre pelo lado de quem esta na tela.
    columns:
      - name: time_id
        tests: [not_null]
      - name: adversario_id
        tests: [not_null]

  - name: gold_jogador_temporada
    description: >
      Pagina de elenco. Depende da onda 3 — use jogos_com_dado para saber
      quanto da amostra ja existe antes de tirar conclusao.
    columns:
      - name: player_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]

  - name: gold_tecnico_desempenho
    description: >
      Aproveitamento por tecnico, derivado da escalacao de cada jogo e nao do
      cadastro de carreira (que tem datas pouco confiaveis).
    columns:
      - name: coach_id
        tests: [not_null]
      - name: jogos
        tests: [not_null]

  - name: gold_campanha
    description: >
      Campanha jogo a jogo de todos os times, com pontos acumulados e forma
      dos 5 jogos anteriores. Universal: o filtro de clube e um where de quem
      consulta, nao uma decisao do model.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: time_id
        tests: [not_null]
      - name: jogo_n
        tests: [not_null]

  - name: gold_features_partida
    description: >
      Tabela de features para modelo de previsao. Toda coluna de feature contem
      apenas informacao disponivel ANTES do jogo; as janelas terminam em
      "1 preceding" para evitar data leakage. As colunas alvo_* sao o que se
      quer prever e nunca entram como entrada do modelo.
    columns:
      - name: fixture_id
        tests: [not_null]
      - name: time_id
        tests: [not_null]
      - name: alvo_resultado
        tests:
          - not_null
          - accepted_values:
              values: ['V', 'E', 'D']
